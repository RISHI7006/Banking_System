# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Modern Banking Management System - Simultaneous Frontend & Backend Deployment
# ==============================================================================
# When you connect this repository to Render (Dashboard > Blueprints > New Blueprint),
# Render will automatically create and launch both services together:
# 1. modern-banking-api: Python FastAPI Machine Learning Backend (Web Service)
# 2. modern-banking-ui: React Vite UI with 3D Animated Logo (Static Site)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Machine Learning Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: modern-banking-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_backend.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: modern-banking-ui
    runtime: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: modern-banking-api
          type: web
          property: host
